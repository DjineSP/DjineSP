<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Table périodique de la stack de DjineSP : C, C#, Java, Git" xmlns:c2pa="http://c2pa.org/manifest">
<style>
  text{font-family:'SF Mono','JetBrains Mono',Consolas,'Courier New',monospace}
  .bg{fill:#0d1117}
  .title{fill:#e6edf3;font-size:20px;font-weight:700}
  .sub{fill:#8b949e;font-size:12px}
  .num{font-size:12px;fill:#c9d1d9}
  .sym{font-size:44px;font-weight:700}
  .name{font-size:11px;fill:#c9d1d9}
  .tile{opacity:0;transform-box:fill-box;animation:rise .7s ease-out forwards}
  .t1{animation-delay:.1s}.t2{animation-delay:.3s}.t3{animation-delay:.5s}.t4{animation-delay:.7s}
  .t5{animation-delay:.9s}.t6{animation-delay:1.05s}.t7{animation-delay:1.2s}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .unstable{fill:none;stroke:#8b949e;stroke-width:1.5;stroke-dasharray:6 5;animation:dash 1.4s linear infinite,glow 2.4s ease-in-out infinite}
  @keyframes dash{to{stroke-dashoffset:-22}}
  @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
  .q{fill:#8b949e;font-size:38px;font-weight:700}
  .cur{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.tile{animation:none;opacity:1}.unstable,.cur{animation:none}}
</style>
<rect class="bg" width="800" height="330" rx="14"/>
<text class="title" x="30" y="46">DjineSP <tspan fill="#8b949e" font-weight="400">/ table périodique</tspan></text>
<text class="sub" x="30" y="68">Éléments stables et éléments en synthèse<tspan class="cur">_</tspan></text>

<!-- C -->
<g class="tile t1">
  <rect x="30" y="95" width="100" height="130" rx="10" fill="#2a2110" stroke="#e3b341" stroke-width="2"/>
  <text class="num" x="42" y="116">1</text>
  <text class="sym" x="80" y="177" text-anchor="middle" fill="#e3b341">C</text>
  <text class="name" x="80" y="208" text-anchor="middle">Systèmes</text>
</g>
<!-- C# -->
<g class="tile t2">
  <rect x="150" y="95" width="100" height="130" rx="10" fill="#1f1830" stroke="#a371f7" stroke-width="2"/>
  <text class="num" x="162" y="116">2</text>
  <text class="sym" x="200" y="177" text-anchor="middle" fill="#a371f7">C#</text>
  <text class="name" x="200" y="208" text-anchor="middle">Applications</text>
</g>
<!-- Java -->
<g class="tile t3">
  <rect x="270" y="95" width="100" height="130" rx="10" fill="#2b1a0c" stroke="#f0883e" stroke-width="2"/>
  <text class="num" x="282" y="116">3</text>
  <text class="sym" x="320" y="177" text-anchor="middle" fill="#f0883e">Jv</text>
  <text class="name" x="320" y="208" text-anchor="middle">Java · POO</text>
</g>
<!-- Git -->
<g class="tile t4">
  <rect x="390" y="95" width="100" height="130" rx="10" fill="#2d1512" stroke="#f85149" stroke-width="2"/>
  <text class="num" x="402" y="116">4</text>
  <text class="sym" x="440" y="177" text-anchor="middle" fill="#f85149">Gt</text>
  <text class="name" x="440" y="208" text-anchor="middle">Versioning</text>
</g>
<!-- unstable -->
<g class="tile t5">
  <rect class="unstable" x="510" y="95" width="100" height="130" rx="10"/>
  <text class="num" x="522" y="116">5</text>
  <text class="q" x="560" y="177" text-anchor="middle">?</text>
  <text class="name" x="560" y="208" text-anchor="middle">en synthèse</text>
</g>
<g class="tile t6">
  <rect class="unstable" x="630" y="95" width="100" height="130" rx="10"/>
  <text class="num" x="642" y="116">6</text>
  <text class="q" x="680" y="177" text-anchor="middle">?</text>
  <text class="name" x="680" y="208" text-anchor="middle">en synthèse</text>
</g>

<!-- legend -->
<rect x="30" y="262" width="14" height="14" rx="3" fill="#2a2110" stroke="#e3b341" stroke-width="1.5"/>
<text class="sub" x="52" y="274">stable : je maîtrise</text>
<rect x="230" y="262" width="14" height="14" rx="3" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3 2"/>
<text class="sub" x="252" y="274">instable : j'apprends</text>
<text class="sub" x="770" y="274" text-anchor="end">Maybe not today, but certainly tomorrow.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
